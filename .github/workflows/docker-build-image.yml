name: Build and push Docker image

on:
  workflow_dispatch:
  push:
    branches: [ "master", "set-neuron-parameters" ]
  pull_request:
    branches: [ "master" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        timeout-minutes: 180
        continue-on-error: false
        with:
          platforms: linux/amd64,linux/arm64
          context: "{{defaultContext}}:docker/base-image"
          push: true
          tags: |
            ${{ vars.DOCKERHUB_LOGIN }}/knp-base-image:v2.0.93
            ${{ vars.DOCKERHUB_LOGIN }}/knp-base-image:latest
          build-args: KNP_IMAGE_VERSION=v2.0.93

      - name: Build and push build image
        uses: docker/build-push-action@v7
        timeout-minutes: 180
        continue-on-error: false
        with:
          platforms: linux/amd64,linux/arm64
          context: "{{defaultContext}}:docker/build-image"
          push: true
          build-args: KNP_IMAGE_VERSION=v2.0.93
          tags: |
            ${{ vars.DOCKERHUB_LOGIN }}/knp-build-image:v2.0.93
            ${{ vars.DOCKERHUB_LOGIN }}/knp-build-image:latest
